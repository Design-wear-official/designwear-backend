# Fly.io config. Deploy with:  fly launch --no-deploy --copy-config   (first time)
#                              fly volume create designwear_data --size 1 --region sin
#                              fly secrets set ...   (see README "Hosting")
#                              fly deploy --ha=false
app = "designwear-api"
primary_region = "sin"   # Singapore; change to e.g. "bom" (Mumbai) if available to you

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"

# Accounts, orders and designs live in one file on this disk, so run exactly ONE
# machine and never let it stop (rate limits and the image cache are in memory too).
[[mounts]]
  source = "designwear_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
