name: Build and Deploy to Vercel

on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
      - name: Deploy to Vercel
        run: |
            mv .git .git.bak && npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes ; mv .git.bak .git